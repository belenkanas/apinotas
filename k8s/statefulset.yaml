apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: notas-api
spec:
  serviceName: notas-api-headless
  replicas: 3
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0   # actualiza todos los pods con ordinal >= partition
  selector:
    matchLabels:
      app: notas-api
  template:
    metadata:
      labels:
        app: notas-api
    spec:
      containers:
        - name: notas-api
          image: notas-api:v1  
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: APP_VERSION
              value: "v1"
          volumeMounts:
            - name: config
              mountPath: /etc/notas-config
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: notas-api-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Mi
---
# Service headless: obligatorio para que el StatefulSet le dé identidad de red
# estable a cada pod (notas-api-0, notas-api-1, notas-api-2)
apiVersion: v1
kind: Service
metadata:
  name: notas-api-headless
spec:
  clusterIP: None
  selector:
    app: notas-api
  ports:
    - port: 8000
      targetPort: 8000
---
# Service normal, para acceder desde afuera del cluster (minikube)
apiVersion: v1
kind: Service
metadata:
  name: notas-api-svc
spec:
  type: NodePort
  selector:
    app: notas-api
  ports:
    - port: 8000
      targetPort: 8000