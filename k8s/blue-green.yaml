apiVersion: apps/v1
kind: Deployment
metadata:
  name: notas-api-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notas-api
      color: blue
  template:
    metadata:
      labels:
        app: notas-api
        color: blue
    spec:
      containers:
        - name: notas-api
          image: notas-api:v1
          ports:
            - containerPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notas-api-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notas-api
      color: green
  template:
    metadata:
      labels:
        app: notas-api
        color: green
    spec:
      containers:
        - name: notas-api
          image: notas-api:v2
          ports:
            - containerPort: 8000
---
# Service de "producción": lo único que se toca para hacer el switch
apiVersion: v1
kind: Service
metadata:
  name: notas-api-prod
spec:
  type: NodePort
  selector:
    app: notas-api
    color: blue        # <-- esto define quién recibe el tráfico real
  ports:
    - port: 8000
      targetPort: 8000
---
# Opcionales: para poder testear cada color por separado, sin pasar por prod
apiVersion: v1
kind: Service
metadata:
  name: notas-api-blue-svc
spec:
  selector:
    app: notas-api
    color: blue
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: notas-api-green-svc
spec:
  selector:
    app: notas-api
    color: green
  ports:
    - port: 8000
      targetPort: 8000